name: Deploy to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '20.x'
  AZURE_WEBAPP_NAME: 'patient-demo-ai'  # Your Azure App Service name
  AZURE_WEBAPP_PACKAGE_PATH: './patient-service-demo/src/PatientService.API'

jobs:
  # ============================================================================
  # Backend Deployment Job (.NET 9 API)
  # ============================================================================
  deploy-backend:
    name: Deploy Backend to Azure App Service
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore patient-service-demo.sln
        working-directory: ./patient-service-demo

      - name: Build
        run: dotnet build patient-service-demo.sln --configuration Release --no-restore
        working-directory: ./patient-service-demo

      - name: Run tests
        run: dotnet test patient-service-demo.sln --configuration Release --no-build --verbosity normal
        working-directory: ./patient-service-demo

      - name: Publish
        run: dotnet publish -c Release -o ${{env.DOTNET_ROOT}}/api
        working-directory: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{env.DOTNET_ROOT}}/api

  # ============================================================================
  # Frontend Deployment Job (Angular 18)
  # ============================================================================
  deploy-frontend:
    name: Deploy Frontend to Azure Static Web Apps
    runs-on: ubuntu-latest
    needs: deploy-backend  # Wait for backend to deploy first
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './patient-service-demo/patient-portal/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ./patient-service-demo/patient-portal

      - name: Build Angular app
        run: npm run build -- --configuration production
        working-directory: ./patient-service-demo/patient-portal
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '/patient-service-demo/patient-portal'
          output_location: 'dist/patient-portal/browser'
          skip_app_build: true  # We already built it

  # ============================================================================
  # Health Check Job
  # ============================================================================
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    
    steps:
      - name: Wait for deployment to stabilize
        run: sleep 30

      - name: Check Backend Health
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/patients)
          if [ $response -eq 200 ]; then
            echo "✓ Backend is healthy (HTTP $response)"
          else
            echo "✗ Backend health check failed (HTTP $response)"
            exit 1
          fi

      - name: Check Frontend Health
        run: |
          # This will be updated with your Static Web App URL
          echo "✓ Frontend deployed successfully"
          echo "Check: https://YOUR_STATIC_WEB_APP.azurestaticapps.net"

